<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Ice Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet"><style>
:root{--sub:#94969b;--border:rgba(255,255,255,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0b0c0e;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{overflow:hidden;}
.ice-screen{position:fixed;inset:0;width:100%;height:100%;z-index:60;display:flex;flex-direction:column;background:#0a0a0a;}
.playhub-back{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:#22252b;color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto;}
.playhub-balance{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid var(--border);border-radius:14px;background:#1b1d21;font-size:12px;font-weight:800;}
.balance-val{font-weight:800;}
@keyframes hubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ice-screen{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#0a0a0a;}.ice-screen.active{display:flex;animation:hubIn .2s ease-out;}.ice-topbar{display:flex;align-items:center;gap:10px;padding:16px max(16px,calc((100% - 480px)/2));flex:0 0 auto;}.ice-title{flex:1;}.ice-title strong{display:block;font-size:17px;letter-spacing:-.2px;}.ice-title small{display:block;margin-top:2px;color:#b8bdc2;font-size:10px;}.ice-title i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ffc61a;box-shadow:0 0 8px #ffc61a;vertical-align:middle;}.ice-body{flex:1 1 auto;min-height:0;padding:2px max(16px,calc((100% - 480px)/2)) calc(30px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}.ice-stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin:5px 0 12px;}.ice-stats>div{padding:10px 9px;border:1px solid var(--border);border-radius:13px;background:#1a1d21;min-width:0;}.ice-stats span{display:block;color:var(--sub);font-size:8px;letter-spacing:.3px;}.ice-stats b{display:block;margin-top:5px;color:#fff4d1;font-size:11px;white-space:nowrap;}.ice-stats>div:nth-child(2){background:linear-gradient(135deg,#3a2d05,#33270a);}.ice-stats>div:nth-child(2) b{color:#ffd45a;}.ice-arena-shell{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.35);border-radius:20px;background:#0d0c08;box-shadow:inset 0 0 35px rgba(255,198,26,.12);}.ice-arena{position:relative;width:100%;aspect-ratio:1.23;overflow:hidden;background:#101418;transform-origin:center;transition:transform 1.5s cubic-bezier(.17,.84,.28,1);}.ice-arena:before{content:'';position:absolute;inset:8px;border:1px solid rgba(207,250,255,.3);border-radius:14px;pointer-events:none;z-index:2;}.ice-rink-line{position:absolute;left:50%;top:8px;bottom:8px;width:2px;background:rgba(234,255,255,.34);z-index:2;}.ice-rink-line:after{content:'';position:absolute;width:70px;height:70px;border:1px solid rgba(234,255,255,.25);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);}.ice-zone{position:absolute;top:0;bottom:0;transition:width .35s ease;overflow:hidden;}.ice-zone:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 55%);}.ice-zone span{position:absolute;left:10px;bottom:9px;z-index:1;font-size:10px;font-weight:800;color:rgba(255,255,255,.86);text-shadow:0 1px 3px rgba(0,0,0,.45);}.ice-zone em{font-style:normal;color:rgba(255,255,255,.64);font-weight:600;}.ice-winner{position:absolute;z-index:7;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;}.ice-winner.show{opacity:1;background:rgba(3,12,16,.36);}.ice-winner div{padding:12px 16px;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(14,18,21,.85);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);}.ice-winner b{display:block;font-size:17px;}.ice-winner small{display:block;margin-top:3px;color:#ffe9a8;font-size:11px;}.ice-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:11px 0 13px;}.ice-player{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--border);border-radius:12px;background:#1a1d21;min-width:0;}.ice-player i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}.ice-player span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:700;flex:1;}.ice-player b{font-size:10px;}.ice-controls{padding:13px;border:1px solid var(--border);border-radius:17px;background:#191b1f;}.ice-stake-label{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;}.ice-stake-label strong{color:#fff;}.ice-stakes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px;}.ice-stakes button{padding:9px 1px;border:1px solid var(--border);border-radius:10px;background:#25282e;color:#aeb4ba;font:700 10px inherit;white-space:nowrap;cursor:pointer;}.ice-stakes button.active{border-color:rgba(255,198,26,.6);background:#3d3007;color:#ffe58a;}.ice-join,.ice-start{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;color:#0b0b0b;font:800 13px inherit;cursor:pointer;}.ice-join{background:linear-gradient(135deg,#ffd21f,#f5b800);}.ice-start{display:none;background:#2b3035;color:#fff;}.ice-start.visible{display:block;}.ice-hint{margin:11px 6px;color:var(--sub);font-size:10px;line-height:1.4;text-align:center;cursor:pointer;user-select:none;}.gm-title{display:flex;align-items:baseline;gap:2px;}
    /* The local player sees only their own territory framed in white. */
    .ice-zone.mine{z-index:3;box-shadow:inset 0 0 0 2px #fff,0 0 12px rgba(255,255,255,.4);}
    .ice-zone.mine:before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.72);border-radius:5px;pointer-events:none;z-index:2;}
    /* A clean weighted mosaic always fills the rink without gaps or overflow. */
    .ice-rink-line,.ice-arena:before{display:none;}.ice-arena-shell{border-radius:0;box-shadow:none;}.ice-arena{aspect-ratio:1;border-radius:0;}.ice-zone-map{position:absolute;inset:0;z-index:1;overflow:hidden;}.ice-zone{right:auto!important;bottom:auto!important;clip-path:none!important;box-sizing:border-box;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,background .35s ease;}.ice-zone span{left:50%!important;bottom:auto!important;top:50%;width:76px;transform:translate(-50%,-50%);text-align:center;line-height:1.15;}.ice-zone.mine{box-shadow:inset 0 0 0 2px #fff,0 0 9px rgba(255,255,255,.5);filter:none;}.ice-zone.mine:before{inset:4px;border:1px solid rgba(255,255,255,.75);border-radius:0;}
    .ice-bet-modal{position:absolute;z-index:70;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.56);}.ice-bet-modal.show{display:flex;}.ice-bet-sheet{width:100%;padding:15px 16px 22px;border-radius:22px 22px 0 0;background:#1a1d21;box-shadow:0 -12px 30px rgba(0,0,0,.3);}.ice-bet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;font-size:17px;font-weight:800;}.ice-bet-close{width:29px;height:29px;border:0;border-radius:50%;background:#2c3036;color:#fff;font-size:20px;cursor:pointer;}.ice-bet-field{display:block;margin:10px 0 6px;color:#aeb7be;font-size:11px;font-weight:700;}.ice-bet-field input{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #353a41;border-radius:11px;background:#101215;color:#fff;font:700 14px inherit;outline:none;}.ice-bet-mine{display:flex;align-items:center;gap:8px;margin-top:14px;color:#dbe5e9;font-size:12px;}.ice-bet-confirm{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffd21f,#f5b800);color:#0b0b0b;font:800 14px inherit;cursor:pointer;}
    
    /* End-of-round state: losing zones fade while the winning territory remains alive. */
    .ice-arena-shell{border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);clip-path:inset(0 round 20px);}.ice-arena{border-radius:18px;clip-path:inset(0 round 18px);}.ice-zone-map{border-radius:18px;clip-path:inset(0 round 18px);}.ice-zone{border:1px solid rgba(10,10,10,.75);}.ice-zone.loser{filter:brightness(.28) saturate(.65);}.ice-zone.winner-zone{z-index:2;}.ice-winner.show{background:transparent;}.ice-winner div{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;text-shadow:0 2px 5px rgba(0,0,0,.7);transform:translateY(38px);}.ice-winner b{font-size:14px;}.ice-winner small{color:#fff;font-weight:700;}
    /* ===== Ice Arena: puck appear + arrow orbiting around it (анимацией управляет client.js) ===== */
    .ice-puck{position:absolute;z-index:5;left:0;top:0;width:24px;height:24px;transform:translate3d(0,0,0);pointer-events:none;}
    .puck-img{position:absolute;left:-12px;top:-12px;width:48px;height:48px;display:block;user-select:none;-webkit-user-drag:none;transform-origin:50% 50%;will-change:transform,opacity;}
    .puck-ripple{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 12px rgba(255,214,90,.5);opacity:0;transform:translate(-50%,-50%) scale(.7);will-change:transform,opacity;}
    /* .ice-arrow: нулевой бокс ровно в центре шайбы — вращаем его, и стрелка облетает шайбу по кругу */
    .ice-arrow{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;will-change:transform,opacity;}
    .ice-arrow svg{position:absolute;left:-7px;top:-37px;width:14px;height:20px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)) drop-shadow(0 0 5px rgba(255,255,255,.55));}
    /* Zones: organic weighted-Voronoi cells, area = stake share */
    .zone-item{position:absolute;inset:0;transition:opacity .35s ease;}
    .zone-item svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
    .zone-item polygon{stroke:rgba(10,10,10,.75);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;}
    .zone-item.mine{z-index:3;}.zone-item.mine polygon{stroke:rgba(255,255,255,.55);stroke-width:1.4;}
    .zone-item.winner-zone{z-index:4;}.zone-item.winner-zone polygon{stroke:#fff;stroke-width:2;}
    .zone-item.loser{opacity:.28;}
    .zone-label{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:76px;text-align:center;font-size:10px;font-weight:800;line-height:1.15;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
    .zone-label.small{font-size:9px;}.zone-label em{font-style:normal;color:rgba(255,255,255,.65);font-weight:600;}


.zone-av{position:absolute;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#2b3035}
.lg-av{border-radius:50%;object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.ice-join:disabled{opacity:.45;cursor:not-allowed}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;max-width:88%;padding:10px 14px;border-radius:12px;background:#23272d;border:1px solid var(--border);font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.adm-list{max-height:200px;overflow:auto;margin-top:12px}
.adm-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;background:#101215;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:700}
.adm-row small{display:block;color:#7c838a;font-size:10px;font-weight:600;margin-top:2px}

/* ===== Redesign: black → gold gradient, glass panels, yellow pill buttons ===== */
:root{--sub:#9a968a;--border:rgba(255,255,255,.09);--gold:#ffc61a;--ff-d:'Unbounded','Montserrat',system-ui,sans-serif;--ff-b:'Onest','Manrope','Montserrat',-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{background:#0a0a0a;font-family:var(--ff-b)}
.ice-screen{background:linear-gradient(180deg,#0a0a0a 0%,#0f0f0f 38%,#241b05 78%,#4a3806 100%)}
.ice-topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.ice-topbar .ice-title{grid-column:1;grid-row:1}.ice-topbar .playhub-balance{grid-column:2;grid-row:1}.ice-topbar .playhub-back{grid-column:3;grid-row:1;justify-self:end}
.ice-title strong{font:800 14px var(--ff-d);letter-spacing:0}.ice-title small{color:#a9a496}
.playhub-back{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.playhub-balance{flex-direction:row-reverse;padding:6px 8px 6px 12px;border-radius:999px;background:#121212;border:1px solid rgba(255,198,26,.35);font:800 12px var(--ff-d);box-shadow:0 0 14px rgba(255,198,26,.12)}
.ice-stats>div{background:rgba(255,255,255,.05);border-radius:16px}
.ice-stats b{color:#fff;overflow:hidden;text-overflow:ellipsis}
.ice-stats>div:nth-child(2){background:linear-gradient(135deg,rgba(255,198,26,.22),rgba(255,198,26,.07));border-color:rgba(255,198,26,.4)}
.ice-stats>div:nth-child(2) b{color:var(--gold)}
.ice-arena-shell{border:2px solid rgba(255,255,255,.9);background:#0d0c08}
.ice-controls{padding:16px;border-radius:26px;background:linear-gradient(180deg,rgba(40,40,40,.92),rgba(20,20,20,.94))}
.ice-stake-label strong{color:var(--gold)}
.ice-stakes button{border-radius:999px;background:rgba(255,255,255,.06);color:#c9c5b8;font-family:var(--ff-d);font-size:11px;font-weight:700}
.ice-stakes button.active{border-color:var(--gold);background:rgba(255,198,26,.16);color:var(--gold)}
.ice-bet-field input{border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-family:var(--ff-d);font-size:13px;font-weight:700;text-align:center}
.ice-join,.ice-bet-confirm{border-radius:999px;background:var(--gold);color:#0b0b0b;font-family:var(--ff-d);font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(255,198,26,.28)}
.ice-join:disabled{opacity:.4;box-shadow:none}
.ice-player{background:rgba(255,255,255,.05);border-radius:999px;padding:7px 10px}.ice-player b{color:var(--gold)}
.ice-bet-sheet{background:#161616;border-top:1px solid rgba(255,198,26,.3)}
.adm-row{background:#0f0f0f}
.toast{background:#1a1a1a;border-color:rgba(255,198,26,.35)}

/* ===== Header: history button, balance pill, top/last game cards, total bar ===== */
.ice-topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.hd-btns{display:flex;gap:10px}
.hd-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#2d2d2d,#1b1b1b);color:#cfcabb;display:grid;place-items:center;cursor:pointer;font-size:18px}
.playhub-balance{flex-direction:row;gap:7px;padding:11px 16px;background:rgba(255,198,26,.14);border-color:rgba(255,198,26,.4);font-size:14px}
.playhub-balance .gem{color:var(--gold)}.balance-cur{font-size:12px;letter-spacing:.3px}
.gem{font-size:15px;line-height:1;flex:0 0 auto;vertical-align:middle}
.hd-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
.hd-card{padding:7px 10px 10px;border-radius:18px;background:linear-gradient(180deg,#252525,#1a1a1a);border:1px solid rgba(255,255,255,.06);min-width:0}
.hd-card small{display:block;text-align:center;color:#8c8879;font-size:11px;font-weight:700;margin-bottom:8px}
.hd-row{display:flex;align-items:center;gap:7px;min-height:22px;font-size:12px;font-weight:800}
.hd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c5b8}
.hd-win{display:flex;align-items:center;gap:3px;color:#fff;white-space:nowrap}.hd-win .gem{font-size:11px}
.hd-empty{width:100%;text-align:center;color:#6f6b5f;font-weight:600}
.ice-game-card{padding:12px;border-radius:28px;background:linear-gradient(180deg,#262626,#171717);border:1px solid rgba(255,255,255,.06)}
.ice-total{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 6px 12px;font-weight:800}
.tot-l{color:#8c8879;font-size:16px;display:flex;align-items:center;gap:6px}.tot-l b{color:var(--gold);font-family:var(--ff-d);font-size:15px}.tot-l .gem{font-size:17px}
.tot-r{color:#a09b8c;font-size:14px;text-align:right}
.ice-game-card .ice-arena-shell{border:1px solid rgba(255,255,255,.14)}
.hist-list{max-height:58vh;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05)}
.hist-row .hd-name{color:#fff;font-size:13px;font-weight:800;display:block}.hist-row small{display:block;color:#8c8879;font-size:10px;font-weight:600;margin-top:2px}
.hist-row .hd-win{font-size:13px}.hist-row .hd-win .gem{font-size:13px}

/* ===== Game details modal: hash/seed, participants, legit check ===== */
.star{font-size:15px;line-height:1}
.gm-date{color:var(--sub);font-size:12px;margin:-6px 0 14px}
.gm-hashes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.gm-hash{position:relative;padding:9px 30px 9px 11px;border-radius:12px;background:rgba(255,255,255,.05);min-width:0}
.gm-hash span{display:block;color:var(--sub);font-size:10px;font-weight:700;margin-bottom:3px}
.gm-hash b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;color:#e7e3d6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-copy{position:absolute;right:6px;top:6px;width:22px;height:22px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:#cfcabb;font-size:12px;cursor:pointer}
.gm-players{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto;margin-bottom:14px}
.gm-p{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid transparent}
.gm-p.win{background:rgba(31,191,117,.12);border-color:rgba(31,191,117,.5);box-shadow:0 0 16px rgba(31,191,117,.15)}
.gm-p .lg-av{width:32px;height:32px;font-size:13px}
.gm-p-name{flex:1;min-width:0}
.gm-p-name b{display:flex;align-items:center;gap:6px;font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-p-name small{display:block;color:var(--sub);font-size:11px;margin-top:1px}
.gm-p.win .gm-p-name small{color:#5fe0a0}
.gm-win-badge{padding:1px 7px;border-radius:999px;background:rgba(31,191,117,.2);color:#5fe0a0;font-size:9px;font-weight:800}
.gm-p-amt{font-weight:800;font-size:13px;color:#fff;white-space:nowrap}
.gm-p.win .gm-p-amt{color:#5fe0a0}
.gm-check{width:100%;border:0;border-radius:12px;padding:12px;background:rgba(255,255,255,.08);color:#fff;font:800 13px var(--ff-b);cursor:pointer}
.gm-check:disabled{opacity:.5;cursor:default}
.gm-verdict{margin-top:10px;text-align:center;font-size:12px;font-weight:700;min-height:16px}
.gm-verdict.ok{color:#5fe0a0}.gm-verdict.bad{color:#ff6b6b}
.hd-card,.hist-row{cursor:pointer}
/* ===== Аномалии ===== */
.anomaly-badge{position:absolute;z-index:8;top:10px;right:10px;width:42px;height:42px;border-radius:12px;display:none;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#2d2d2d,#1b1b1b);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.14);}
.anomaly-badge.show{display:flex}
.anomaly-badge .ab-ball{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.85);opacity:0}
.anomaly-badge.rolling .ab-ball{opacity:.85;animation:ab-roll 1.1s ease-in-out infinite alternate}
@keyframes ab-roll{from{transform:translateX(-11px)}to{transform:translateX(11px)}}
.anomaly-badge .ab-icon{width:24px;height:24px;border-radius:7px;background-size:cover;background-position:center;opacity:0;transform:scale(.5) rotate(0deg);transition:opacity .16s ease,transform .16s ease}
.ab-icon.ic-race{background-image:url(/icons/icon-race.jpg)}
.ab-icon.ic-mirage{background-image:url(/icons/icon-mirage.jpg)}
.ab-icon.ic-redo{background-image:url(/icons/icon-redo.jpg)}
.anomaly-badge.rolling .ab-icon{opacity:1;transform:scale(1) rotate(0deg)}
.anomaly-badge.rolling .ab-icon.flip-out{opacity:0;transform:scale(.66) rotate(-10deg)}
.anomaly-badge.settled .ab-ball{display:none}
.anomaly-badge.settled .ab-icon{opacity:1;transform:scale(1) rotate(0deg);transition:opacity .18s ease,transform .45s cubic-bezier(.22,1.14,.36,1)}
.adm-anomaly{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0 4px}
.adm-anomaly button{padding:9px 4px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.06);color:#c9c5b8;font:700 11px var(--ff-b);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.adm-anomaly button img{width:16px;height:16px;border-radius:4px;object-fit:cover}
.hd-anomaly{width:15px;height:15px;border-radius:4px;object-fit:cover;vertical-align:-2px;margin-left:3px}
/* аномалия "Гонка": зоны едут вверх конвейером, пока шайба катится */
.race-track{position:absolute;left:0;right:0;top:0;height:200%;animation:race-scroll 3.6s linear infinite;will-change:transform}
.race-frame{position:absolute;left:0;right:0;top:0;height:50%}
.race-frame:nth-child(2){top:50%}
@keyframes race-scroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
/* аномалия "Hide": весь экран "плывёт" — жидкое искажение через SVG feTurbulence/feDisplacementMap */
.ice-screen.mirage-active{filter:url(#mirageFilter)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="mirageFilter" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" values="0.006 0.012;0.012 0.02;0.006 0.012" dur="7s" repeatCount="indefinite"/></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs></svg>
<div class="ice-screen active" id="iceScreen">
  <div class="ice-topbar">
    <div class="hd-btns"><button class="hd-btn" id="exitBtn" aria-label="Выйти"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button><button class="hd-btn" id="histBtn" aria-label="История игр"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9z"/></svg></button></div>
    <div class="playhub-balance" id="balancePill"><span class="star">⭐</span><span class="balance-val" id="bal">0</span></div>
  </div>
  <div class="ice-body">
    <div class="hd-cards">
      <div class="hd-card"><small>Топ игра</small><div class="hd-row" id="topGame"><span class="hd-empty">Пока нет игр</span></div></div>
      <div class="hd-card"><small>Последняя игра</small><div class="hd-row" id="lastGame"><span class="hd-empty">Пока нет игр</span></div></div>
    </div>
    <div class="ice-game-card"><div class="ice-total"><span class="tot-l">Банк <b id="icePool">0</b><span class="star">⭐</span></span><span class="tot-r" id="iceStatus">Подключение…</span></div>
    <div class="ice-arena-shell" id="iceArenaShell"><div class="ice-arena" id="iceArena"><div class="ice-zone-map" id="iceZoneMap"></div><div class="ice-puck" id="icePuck"><span class="puck-ripple"></span><img class="puck-img" alt="" draggable="false" src="/puck.png"><span class="ice-arrow"><svg viewBox="0 0 14 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19V3M2.2 7.8 7 3l4.8 4.8"/></svg></span></div><div id="anomalyBadge" class="anomaly-badge"><span class="ab-ball"></span><span class="ab-icon"></span></div><div class="ice-winner" id="iceWinner"></div></div></div></div>
    <div class="ice-controls"><div class="ice-stake-label">Ставка, ⭐ <strong id="stakeInfo"></strong></div>
      <div class="ice-stakes"><button data-a="min">Мин</button><button data-a="-5">−5</button><button data-a="-1">−1</button><button data-a="+1">+1</button><button data-a="+5">+5</button><button data-a="max">Макс</button></div>
      <div class="ice-bet-field" style="margin:10px 0 0"><input id="betAmt" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
      <button class="ice-join" id="iceJoinBtn" disabled>Поставить</button></div>
    <div class="ice-legend" id="iceLegend"></div>
    <p class="ice-hint" id="iceHint">Бла-Бла-Бла это все равно никто не читает..</p>
  </div>
  <div class="ice-bet-modal" id="histModal"><div class="ice-bet-sheet"><div class="ice-bet-head">История игр <button class="ice-bet-close" id="histClose">×</button></div><div class="hist-list" id="histList"></div></div></div>
  <div class="ice-bet-modal" id="gameModal"><div class="ice-bet-sheet game-sheet"><div class="ice-bet-head"><span class="gm-title">Игра #<span id="gmId"></span></span><button class="ice-bet-close" id="gmClose">×</button></div>
    <div class="gm-date" id="gmDate"></div>
    <div class="gm-hashes">
      <div class="gm-hash"><span>Хеш</span><b id="gmHash"></b><button class="gm-copy" data-t="hash" aria-label="Скопировать хеш">⧉</button></div>
      <div class="gm-hash"><span>Сид</span><b id="gmSeed"></b><button class="gm-copy" data-t="seed" aria-label="Скопировать сид">⧉</button></div>
    </div>
    <div class="gm-players" id="gmPlayers"></div>
    <button class="gm-check" id="gmCheckBtn">Legit check</button>
    <div class="gm-verdict" id="gmVerdict"></div></div></div>
  <div class="ice-bet-modal" id="adminModal"><div class="ice-bet-sheet"><div class="ice-bet-head">Админ-панель <button class="ice-bet-close" id="adminClose">×</button></div>
    <label class="ice-bet-field">Telegram ID игрока<input id="admId" inputmode="numeric" placeholder="нажмите на игрока в списке"></label>
    <label class="ice-bet-field">Сумма, ⭐ (минус — списать)<input id="admAmt" type="number" step="0.01" value="1" inputmode="decimal"></label>
    <button class="ice-bet-confirm" id="admGive">Выдать / списать</button>
    <label class="ice-bet-field">Аномалии (форс на следующий раунд)</label>
    <div class="adm-anomaly"><button data-an="race"><img src="/icons/icon-race.jpg" alt="">Гонка</button><button data-an="mirage"><img src="/icons/icon-mirage.jpg" alt="">H̷̢̨̹̞͚̫̖͓̳͇̰̹͕̝̘̘͂͛͒̈́͌̈́̈́̕̕͝͝͝͝i̸̟̮͙͕͎͇̱̯̪̤̺̯̩̗̘̐̅̿͌͛̈́̾̓́̓̿̿̕͘͝d̶͉̤̤͕̬̱̻̥͎͙͎̹̰̲̩̈́͐͌̿̓͆̈́̄̈́̄̾͐̚͘͝e̸̬̥̫͙̜̫͕̙̩̳͙̰͚͖̠̍̾̾͛̇͋͊̇̕͝͝͝͝͝</button><button data-an="redo"><img src="/icons/icon-redo.jpg" alt="">Вторая жизнь!</button><button data-an="">✖ Снять</button></div>
    <div class="adm-list" id="adminList"></div></div></div>
  <div class="toast" id="toast"></div>
</div>
